# Игровой сервер на своём VPS: контейнер игры + Caddy (HTTPS-сертификат Let's Encrypt, wss://).
# Запуск на сервере (из корня репозитория):
#   cp deploy/vps/.env.example deploy/vps/.env   # вписать домен и почту
#   docker compose -f deploy/vps/docker-compose.yml up -d --build
services:
  game:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      # Caddy стоит перед игрой — адрес игрока берём из X-Forwarded-For
      TRUST_PROXY: "1"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      MAX_ROOMS: ${MAX_ROOMS:-300}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    expose:
      - "2567"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?впишите GAME_DOMAIN в deploy/vps/.env}
      ACME_EMAIL: ${ACME_EMAIL:?впишите ACME_EMAIL в deploy/vps/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
