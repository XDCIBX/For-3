# fly.toml app configuration file generated for 25waves on 2026-11-05T12:08:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '25waves'
primary_region = 'ams'

[build]
[env]
  PORT = '2567'
  TRUST_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 900
    soft_limit = 600

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
