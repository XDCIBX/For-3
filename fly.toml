# Fly.io (из корня репозитория): fly launch --copy-config --no-deploy, затем fly deploy --ha=false
# ВАЖНО: ровно одна машина. Комнаты живут в памяти сервера; на двух машинах игроки с одним кодом
# могли бы попасть на разные машины и не найти комнату.
app = "CHANGE-ME-25waves"
primary_region = "fra"

[env]
  TRUST_PROXY = "1"
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # Не усыплять: иначе первый игрок ждёт запуска, а комнаты для переподключения пропадают
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 600
    hard_limit = 900

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
