name: Сборка для Steam (Windows / macOS / Linux)

# Запуск вручную (вкладка Actions → «Run workflow») или по тегу версии v*.
# Сборки — в артефактах (архивы .tar.gz: сохраняют права на запуск и симлинки macOS).
# Загрузка в Steam (SteamPipe) — задание steam: по тегу v* или вручную с галочкой «Загрузить в Steam».
# Логин — только из секретов окружения GitHub «steam» (см. steam/STEAMPIPE.md).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Загрузить сборки в Steam
        type: boolean
        default: false
      branch:
        description: Сразу выставить на закрытую ветку Steam (например beta; пусто — вручную в Steamworks)
        type: string
        default: ''
  push:
    tags: ['v*']

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            dir: win-unpacked
          - os: macos-latest
            target: mac
            dir: mac-universal
          - os: ubuntu-latest
            target: linux
            dir: linux-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Сборка
        working-directory: desktop
        env:
          # Адрес публичного игрового сервера (wss://…): переменная репозитория SERVER_URL (Settings → Variables)
          VITE_SERVER_URL: ${{ vars.SERVER_URL || secrets.SERVER_URL }}
          # Подпись и нотаризация macOS (необязательно): сертификат Developer ID и Apple ID
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: npm run dist:${{ matrix.target }}
      - name: Архив сборки
        shell: bash
        run: tar -czf 25-waves-${{ matrix.target }}.tar.gz -C desktop/release "${{ matrix.dir }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 25-waves-${{ matrix.target }}
          path: 25-waves-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  steam:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload
    runs-on: ubuntu-latest
    # Секреты Steam лежат в окружении «steam» (Settings → Environments): им можно включить ручное подтверждение
    environment: steam
    steps:
      - uses: actions/checkout@v4

      - name: Проверка настроек
        id: check
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_TOTP_SECRET: ${{ secrets.STEAM_TOTP_SECRET }}
          MANUAL: ${{ inputs.upload }}
        run: |
          problems=""
          grep -qE '"appId": *"[0-9]+"' steam/steampipe/ids.json || problems="$problems; не вписан AppID в steam/steampipe/ids.json"
          [ -n "$STEAM_USERNAME" ] || problems="$problems; нет секрета STEAM_USERNAME"
          if [ -z "$STEAM_CONFIG_VDF" ] && { [ -z "$STEAM_PASSWORD" ] || [ -z "$STEAM_TOTP_SECRET" ]; }; then
            problems="$problems; нужен STEAM_CONFIG_VDF или пара STEAM_PASSWORD + STEAM_TOTP_SECRET"
          fi
          if [ -n "$problems" ]; then
            if [ "$MANUAL" = "true" ]; then echo "::error::Загрузка в Steam не настроена${problems}"; exit 1; fi
            echo "::warning::Загрузка в Steam пропущена (не настроена)${problems}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          pattern: 25-waves-*
          merge-multiple: true
          path: artifacts

      - name: Распаковка сборок
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p desktop/release
          for f in artifacts/*.tar.gz; do tar -xzf "$f" -C desktop/release; done
          ls -la desktop/release

      - name: Файлы SteamPipe (.vdf)
        if: steps.check.outputs.ready == 'true'
        env:
          BRANCH: ${{ inputs.branch }}
          DESC: 25 Waves ${{ github.ref_name }} (${{ github.sha }})
        run: node steam/steampipe/make-vdf.mjs --content desktop/release --desc "$DESC" --setlive "$BRANCH"

      - name: Установка steamcmd
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lib32gcc-s1
          mkdir -p "$HOME/Steam"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$HOME/Steam"
          "$HOME/Steam/steamcmd.sh" +quit || true

      - name: Загрузка в Steam
        if: steps.check.outputs.ready == 'true'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_TOTP_SECRET: ${{ secrets.STEAM_TOTP_SECRET }}
        run: |
          set -o pipefail
          BUILD="$PWD/steam/steampipe/build/app_build.vdf"
          if [ -n "$STEAM_CONFIG_VDF" ]; then
            # Сохранённый вход (config.vdf с компьютера, где уже вводили код Steam Guard)
            mkdir -p "$HOME/Steam/config"
            echo "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/Steam/config/config.vdf"
            "$HOME/Steam/steamcmd.sh" +login "$STEAM_USERNAME" +run_app_build "$BUILD" +quit | tee steamcmd.log
          else
            CODE="$(node steam/steampipe/guard-code.mjs)"
            echo "::add-mask::$CODE"
            "$HOME/Steam/steamcmd.sh" +login "$STEAM_USERNAME" "$STEAM_PASSWORD" "$CODE" +run_app_build "$BUILD" +quit | tee steamcmd.log
          fi
          # steamcmd иногда возвращает 0 при ошибке — успех определяем по журналу
          if ! grep -q "Successfully finished AppID" steamcmd.log; then
            echo "::error::Загрузка не удалась (см. журнал steamcmd и артефакт steampipe-logs)"; exit 1
          fi
          grep "Successfully finished AppID" steamcmd.log

      - name: Журналы SteamPipe
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: steampipe-logs
          path: |
            steamcmd.log
            steam/steampipe/build/output/
          if-no-files-found: ignore
