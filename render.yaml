# Развёртывание на Render.com в одну кнопку: сервер игры + веб-клиент на одном адресе
services:
  - type: web
    name: three-heroes
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
